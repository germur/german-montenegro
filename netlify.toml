[build]
  command = "npm run build && npm test"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  # The project's existing Netlify settings still enable the Next runtime.
  # Skip it explicitly while publishing Astro's static output.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

# El sitio respondia igual en el apex y en www, sin redirigir, asi que Google
# veia dos sitios completos duplicados. El apex es el host canonico: es el que
# usan las etiquetas canonical y las 23 URLs del sitemap.
[[redirects]]
  from = "https://www.germanmontenegro.fit/*"
  to = "https://germanmontenegro.fit/:splat"
  status = 301
  force = true
